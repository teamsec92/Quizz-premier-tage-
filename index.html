<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Quiz des pièces — Premier étage</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px 10px;
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    color: #222;
}

.container {
    max-width: 1100px;
    margin: auto;
}

h1 {
    text-align: center;
    font-size: 34px;
    margin: 10px 0 25px;
}

.quiz-card {
    background: white;
    border-radius: 24px;
    padding: 18px;
    box-shadow: 0 3px 15px rgba(0,0,0,0.08);
}

/* =========================
   PLAN
   ========================= */

.plan-container {
    position: relative;
    width: 100%;
    overflow: hidden;
    border: 1px solid #ddd;
    background: white;
}

.plan-image {
    display: block;
    width: 100%;
    height: auto;

    /* Cache uniquement la légende à droite */
    clip-path: inset(0 36% 0 0);
}


/* =========================
   PASTILLES
   ========================= */

.room {
    position: absolute;
    width: 4%;
    height: 4%;
    transform: translate(-50%, -50%);
    z-index: 5;

    background: transparent;
    border: 1px solid rgba(40, 100, 180, 0.35);
    border-radius: 50%;

    padding: 0;
    cursor: pointer;

    transition:
        background 0.15s ease,
        border 0.15s ease;
}

.room:hover {
    background: rgba(40, 100, 180, 0.07);
    border-color: rgba(40, 100, 180, 0.65);
}

.room.selected {
    background: rgba(40, 100, 180, 0.10);
    border: 2px solid rgba(40, 100, 180, 0.70);
}

.room.correct {
    background: rgba(50, 170, 80, 0.12);
    border: 2px solid rgba(50, 150, 70, 0.80);
}

.room.incorrect {
    background: rgba(200, 50, 50, 0.10);
    border: 2px solid rgba(200, 50, 50, 0.80);
}


/* =========================
   POSITIONS DES 15 PIÈCES
   ========================= */

.r1  { left: 40.1%; top: 24.7%; }
.r2  { left: 35.1%; top: 24.7%; }
.r3  { left: 45.8%; top: 24.7%; }

.r4  { left: 30.0%; top: 25.3%; }
.r5  { left: 51.3%; top: 25.3%; }

.r6  { left: 30.0%; top: 40.5%; }
.r7  { left: 51.0%; top: 40.5%; }
.r8  { left: 45.8%; top: 40.5%; }
.r9  { left: 40.5%; top: 40.5%; }

.r10 { left: 22.9%; top: 51.0%; }
.r11 { left: 17.5%; top: 51.0%; }
.r12 { left: 13.8%; top: 51.0%; }

.r13 { left: 8.7%; top: 44.0%; }
.r14 { left: 8.7%; top: 32.5%; }
.r15 { left: 8.7%; top: 20.5%; }


/* =========================
   LÉGENDE
   ========================= */

.legend-button {
    display: block;
    margin: 24px auto 30px;

    padding: 14px 28px;

    border: none;
    border-radius: 15px;

    background: #eeeeee;
    color: #2878df;

    font-size: 22px;
    cursor: pointer;
}

.legend-button:hover {
    background: #e4e4e4;
}

.legend {
    display: none;

    margin: 0 auto 25px;
    padding: 18px;

    max-width: 700px;

    background: #f4f6f8;
    border-radius: 15px;

    font-size: 18px;
    line-height: 1.6;
}


/* =========================
   QUESTION
   ========================= */

.question {
    text-align: center;
    font-size: 34px;
    font-weight: bold;
    margin: 10px 0 25px;
}

.answer {
    width: 100%;
    padding: 18px 20px;

    border: 2px solid #ccc;
    border-radius: 16px;

    font-size: 22px;
    outline: none;
}

.answer:focus {
    border-color: #4285f4;
}


/* =========================
   BOUTONS
   ========================= */

.buttons {
    display: flex;
    gap: 16px;
    margin-top: 20px;
}

button.action {
    flex: 1;

    padding: 17px 10px;

    border: none;
    border-radius: 16px;

    font-size: 20px;
    cursor: pointer;

    background: #edf0f4;
    color: #2878df;
}

button.check {
    background: #44954b;
    color: white;
}

button.action:active {
    transform: scale(0.98);
}

.finish {
    display: block;

    margin: 18px auto 0;

    padding: 17px 30px;

    border: none;
    border-radius: 16px;

    background: #222;
    color: white;

    font-size: 20px;

    cursor: pointer;
}


/* =========================
   RÉSULTAT
   ========================= */

.status {
    text-align: center;
    margin-top: 15px;
    font-size: 18px;
    min-height: 25px;
}

.result {
    display: none;

    margin-top: 25px;
    padding: 25px;

    text-align: center;

    background: #f4f6f8;
    border-radius: 18px;

    font-size: 25px;
    font-weight: bold;
}


/* =========================
   IPHONE / MOBILE
   ========================= */

@media (max-width: 600px) {

    body {
        padding: 10px 5px;
    }

    h1 {
        font-size: 28px;
    }

    .quiz-card {
        padding: 12px;
    }

    .question {
        font-size: 30px;
    }

    .answer {
        font-size: 20px;
    }

    .buttons {
        gap: 10px;
    }

    button.action {
        font-size: 18px;
        padding: 16px 5px;
    }

    .finish {
        font-size: 19px;
    }
}
</style>
</head>


<body>

<div class="container">

<h1>Quiz des pièces — Premier étage</h1>

<div class="quiz-card">


<!-- =========================
     PLAN
     ========================= -->

<div class="plan-container">

    <img
        src="plan-premier-étage.png"
        class="plan-image"
        alt="Plan du premier étage"
    >

    <button class="room r1"
        onclick="selectRoom(1)"
        aria-label="Pièce 1"></button>

    <button class="room r2"
        onclick="selectRoom(2)"
        aria-label="Pièce 2"></button>

    <button class="room r3"
        onclick="selectRoom(3)"
        aria-label="Pièce 3"></button>

    <button class="room r4"
        onclick="selectRoom(4)"
        aria-label="Pièce 4"></button>

    <button class="room r5"
        onclick="selectRoom(5)"
        aria-label="Pièce 5"></button>

    <button class="room r6"
        onclick="selectRoom(6)"
        aria-label="Pièce 6"></button>

    <button class="room r7"
        onclick="selectRoom(7)"
        aria-label="Pièce 7"></button>

    <button class="room r8"
        onclick="selectRoom(8)"
        aria-label="Pièce 8"></button>

    <button class="room r9"
        onclick="selectRoom(9)"
        aria-label="Pièce 9"></button>

    <button class="room r10"
        onclick="selectRoom(10)"
        aria-label="Pièce 10"></button>

    <button class="room r11"
        onclick="selectRoom(11)"
        aria-label="Pièce 11"></button>

    <button class="room r12"
        onclick="selectRoom(12)"
        aria-label="Pièce 12"></button>

    <button class="room r13"
        onclick="selectRoom(13)"
        aria-label="Pièce 13"></button>

    <button class="room r14"
        onclick="selectRoom(14)"
        aria-label="Pièce 14"></button>

    <button class="room r15"
        onclick="selectRoom(15)"
        aria-label="Pièce 15"></button>

</div>


<!-- =========================
     LÉGENDE
     ========================= -->

<button class="legend-button" onclick="toggleLegend()">
    👁️ Voir la légende
</button>

<div id="legend" class="legend">

    <strong>Les bureaux du premier étage :</strong>
    <br><br>

    1. Salon Doré
    <br>

    2. Secrétariat particulier
    <br>

    3. Salon Vert
    <br>

    4-7. Bureaux des collaborateurs
    <br>

    8. Salon des huissiers
    <br>

    9. Vestibule
    <br>

    10-15. Appartements privés

</div>


<!-- =========================
     QUESTION
     ========================= -->

<div id="question" class="question">
    Pièce n°1
</div>


<input
    id="answer"
    class="answer"
    type="text"
    placeholder="Écris le nom de la pièce"
    autocomplete="off"
    autocorrect="off"
    spellcheck="false"
>


<!-- =========================
     NAVIGATION
     ========================= -->

<div class="buttons">

    <button
        class="action check"
        onclick="checkAnswer()">
        ✓ Vérifier
    </button>

    <button
        class="action"
        onclick="previousRoom()">
        ← Précédente
    </button>

    <button
        class="action"
        onclick="nextRoom()">
        → Suivante
    </button>

</div>


<button
    class="finish"
    onclick="finishQuiz()">
    🏁 Terminer le quiz
</button>


<div id="status" class="status"></div>

<div id="result" class="result"></div>


</div>
</div>


<script>

/* =========================
   RÉPONSES
   ========================= */

const correctAnswers = {

    1: "Salon Doré",

    2: "Secrétariat particulier",

    3: "Salon Vert",

    4: "Bureaux des collaborateurs",
    5: "Bureaux des collaborateurs",
    6: "Bureaux des collaborateurs",
    7: "Bureaux des collaborateurs",

    8: "Salon des huissiers",

    9: "Vestibule",

    10: "Appartements privés",
    11: "Appartements privés",
    12: "Appartements privés",
    13: "Appartements privés",
    14: "Appartements privés",
    15: "Appartements privés"
};


/* =========================
   VARIABLES
   ========================= */

let currentRoom = 1;

const answers = {};
const checked = {};


/* =========================
   NORMALISATION
   ========================= */

function normalize(text) {

    return text
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[’']/g, "'")
        .replace(/\s+/g, " ")
        .trim();
}


/* =========================
   SAUVEGARDE
   ========================= */

function saveCurrentAnswer() {

    const input = document.getElementById("answer");

    answers[currentRoom] = input.value;
}


/* =========================
   SÉLECTION
   ========================= */

function selectRoom(room) {

    saveCurrentAnswer();

    currentRoom = room;

    updateDisplay();
}


/* =========================
   AFFICHAGE
   ========================= */

function updateDisplay() {

    document.getElementById("question").textContent =
        "Pièce n°" + currentRoom;

    const input =
        document.getElementById("answer");

    input.value =
        answers[currentRoom] || "";

    document.getElementById("status").textContent = "";

    updateRoomColors();

    input.focus();
}


/* =========================
   COULEURS
   ========================= */

function updateRoomColors() {

    for (let i = 1; i <= 15; i++) {

        const room =
            document.querySelector(".r" + i);

        room.classList.remove(
            "selected",
            "correct",
            "incorrect"
        );

        if (i === currentRoom) {

            room.classList.add("selected");
        }

        if (checked[i] === true) {

            const user =
                normalize(answers[i] || "");

            const correct =
                normalize(correctAnswers[i]);

            if (user === correct) {

                room.classList.add("correct");

            } else {

                room.classList.add("incorrect");
            }
        }
    }
}


/* =========================
   VÉRIFIER
   ========================= */

function checkAnswer() {

    saveCurrentAnswer();

    const user =
        normalize(answers[currentRoom] || "");

    const correct =
        normalize(correctAnswers[currentRoom]);

    checked[currentRoom] = true;

    const status =
        document.getElementById("status");

    if (user === correct) {

        status.textContent =
            "✅ Bonne réponse !";

    } else {

        status.textContent =
            "❌ Mauvaise réponse";
    }

    updateRoomColors();
}


/* =========================
   SUIVANTE
   ========================= */

function nextRoom() {

    saveCurrentAnswer();

    if (currentRoom < 15) {

        currentRoom++;

        updateDisplay();

    } else {

        document.getElementById("status").textContent =
            "Tu es déjà sur la dernière pièce.";
    }
}


/* =========================
   PRÉCÉDENTE
   ========================= */

function previousRoom() {

    saveCurrentAnswer();

    if (currentRoom > 1) {

        currentRoom--;

        updateDisplay();

    } else {

        document.getElementById("status").textContent =
            "Tu es déjà sur la première pièce.";
    }
}


/* =========================
   TERMINER
   ========================= */

function finishQuiz() {

    saveCurrentAnswer();

    let score = 0;

    for (let i = 1; i <= 15; i++) {

        const user =
            normalize(answers[i] || "");

        const correct =
            normalize(correctAnswers[i]);

        checked[i] = true;

        if (user === correct) {

            score++;
        }
    }

    updateRoomColors();

    const result =
        document.getElementById("result");

    result.style.display = "block";

    result.innerHTML =
        "🏁 Quiz terminé<br><br>" +
        score +
        " / 15 bonnes réponses";

    document.getElementById("status").textContent = "";

    window.scrollTo({
        top: document.body.scrollHeight,
        behavior: "smooth"
    });
}


/* =========================
   AFFICHER / CACHER LÉGENDE
   ========================= */

function toggleLegend() {

    const legend =
        document.getElementById("legend");

    if (legend.style.display === "block") {

        legend.style.display = "none";

    } else {

        legend.style.display = "block";
    }
}


/* =========================
   TOUCHE ENTRÉE
   ========================= */

document
    .getElementById("answer")
    .addEventListener("keydown", function(event) {

        if (event.key === "Enter") {

            checkAnswer();
        }
    });


/* =========================
   DÉMARRAGE
   ========================= */

updateDisplay();

</script>

</body>
</html>
